<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師端｜作文評分與回饋</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="flex-between">
      <div>
        <h1>教師端</h1>
        <p class="small-note">瀏覽器內存取，支援多班級、多任務的批改流程。</p>
      </div>
    </header>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="classTab">班級管理</button>
      <button class="tab-btn" data-tab="gradingTab">作文批改</button>
    </div>

    <section class="section tab-panel active" id="classTab">
      <div class="flex-between" style="gap:0.75rem;">
        <h2>班級管理</h2>
        <button id="openCreateClassModal">新增班級</button>
      </div>
      <div class="small-note">所有資料皆儲存在瀏覽器本地，請適時匯出備份。</div>
      <div id="classList" class="stacked-list" style="margin-top:0.75rem;"></div>
    </section>

    <section class="section tab-panel" id="gradingTab">
      <h2>作文批改</h2>
      <div class="info-card" id="gradingInfo">
        <div>班級：<span id="currentClassLabel">尚未選擇</span></div>
        <div>批改任務：<span id="currentTaskLabel">尚未選擇</span></div>
      </div>

      <div class="grid-2" style="align-items:end;">
        <div>
          <label for="studentSelect">選擇學生</label>
          <select id="studentSelect"></select>
        </div>
      </div>

      <div id="aspectContainer"></div>

      <div class="sticky-actions">
        <div class="action-grid">
          <button class="ghost" id="openNavModal">開啟面向導覽</button>
          <div class="progress-wrap progress-compact">
            <label>批改進度</label>
            <div class="progress-bar">
              <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="flex-between small-note">
              <span id="progressText">0%</span>
              <button class="secondary" id="openTaskModalBtn" style="display:none;">任務設定</button>
            </div>
          </div>
          <button class="secondary" id="nextStudentBtn">下一位</button>
          <button class="secondary" id="nextUngradedBtn">下一位未完成</button>
        </div>
      </div>
    </section>
  </div>

  <div class="modal" id="createClassModal" style="display:none;">
    <div class="modal-content">
      <div class="flex-between">
        <h3>新增班級</h3>
        <button class="secondary" data-close="createClassModal">關閉</button>
      </div>
      <div class="grid-2" style="margin-top:0.75rem;">
        <div>
          <label for="modalClassName">班級名稱</label>
          <input type="text" id="modalClassName" placeholder="例：七年甲班">
        </div>
        <div>
          <label for="modalClassSize">班級人數</label>
          <input type="number" id="modalClassSize" min="1" max="100" value="30">
        </div>
      </div>
      <div class="flex-end" style="margin-top:0.75rem;">
        <button id="createClassBtn">建立班級</button>
      </div>
    </div>
  </div>

  <div class="modal" id="editClassModal" style="display:none;">
    <div class="modal-content large">
      <div class="flex-between">
        <h3>編輯班級</h3>
        <button class="secondary" data-close="editClassModal">關閉</button>
      </div>
      <div class="grid-3" style="margin-top:0.75rem;">
        <div>
          <label for="editClassName">班級名稱</label>
          <input type="text" id="editClassName">
        </div>
        <div class="flex-between" style="gap:0.5rem; align-items:flex-end;">
          <div>
            <label>資料備份</label>
            <div class="flex-between" style="gap:0.35rem;">
              <button class="secondary" id="importBtn">匯入 JSON</button>
              <input type="file" id="importFile" accept="application/json" style="display:none;">
              <button id="exportBtn">匯出 JSON</button>
            </div>
          </div>
          <div class="small-note">匯入將覆蓋當前班級資料。</div>
          <button class="danger" id="deleteClassBtn">刪除班級</button>
        </div>
      </div>

      <div class="table-scroll" style="margin-top:0.75rem;">
        <table id="studentTable">
          <thead>
            <tr>
              <th>座號</th>
              <th>姓名</th>
              <th>密碼</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="flex-between" style="margin-top:0.75rem; gap:0.5rem;">
        <div class="small-note">若需檢視單一學生密碼，可使用安全檢視器。</div>
        <button class="secondary" id="openSecretModal">開啟密碼檢視器</button>
      </div>
    </div>
  </div>

  <div class="modal" id="secretModal" style="display:none;">
    <div class="modal-content">
      <div class="flex-between">
        <h3>單人密碼檢視</h3>
        <button class="icon-btn close-top" id="closeSecretModal">✕</button>
      </div>
      <div class="grid-3" style="margin-top:0.75rem;">
        <div>
          <label for="secretStudentSelect">選擇學生</label>
          <select id="secretStudentSelect"></select>
        </div>
        <div>
          <label>目前密碼</label>
          <div class="secret-display" id="secretDisplay">—</div>
        </div>
        <div class="flex-between" style="gap:0.35rem; align-items:flex-end;">
          <button class="secondary" id="prevSecret">上一位</button>
          <button class="secondary" id="nextSecret">下一位</button>
        </div>
      </div>
      <div class="small-note">一次顯示單一學生的密碼，避免全表暴露。</div>
    </div>
  </div>

  <div class="modal" id="taskModal" style="display:none;">
    <div class="modal-content">
      <div class="flex-between">
        <h3>批改任務管理</h3>
        <button class="secondary" id="closeTaskModal">關閉</button>
      </div>
      <div class="small-note" style="margin:0.5rem 0;">＋ 區塊為批改任務列表，可編輯或匯出連結</div>
      <div id="taskList"></div>
    </div>
  </div>

  <div class="modal floating" id="navModal" style="display:none;">
    <div class="modal-content">
      <div class="flex-between">
        <h3>面向導覽</h3>
        <button class="icon-btn" data-close="navModal">✕</button>
      </div>
      <div class="floating-nav" id="floatingNav"></div>
      <div class="small-note">點擊可快速跳至各面向區塊。</div>
    </div>
  </div>

  <div class="modal" id="createTaskModal" style="display:none;">
    <div class="modal-content">
      <div class="flex-between">
        <h3>新增批改任務</h3>
        <button class="secondary" data-close="createTaskModal">關閉</button>
      </div>
      <div class="grid-3" style="margin-top:0.75rem;">
        <div>
          <label for="taskTopic">作文主題</label>
          <input type="text" id="taskTopic" placeholder="例：校服議題短文">
        </div>
        <div>
          <label for="taskDate">布置日期</label>
          <input type="date" id="taskDate">
        </div>
        <div>
          <label for="taskNote">教師備註（可選）</label>
          <input type="text" id="taskNote" placeholder="例：需強調論點支持">
        </div>
      </div>
      <div class="flex-end" style="margin-top:0.75rem;">
        <button id="createTaskBtn">新增任務</button>
      </div>
    </div>
  </div>

  <div id="status" class="status" style="display:none;"></div>

  <script src="rubric.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
