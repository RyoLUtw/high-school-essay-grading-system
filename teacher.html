<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師端｜作文評分與回饋</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="flex-between">
      <div>
        <h1>教師端</h1>
        <p class="small-note">建立班級、填寫評分規準並產生給學生的加密連結。</p>
      </div>
      <a class="card" href="index.html" style="max-width: 180px;">← 返回首頁</a>
    </header>

    <section class="section" id="class-section">
      <h2>班級管理</h2>
      <div class="grid-2">
        <div>
          <label for="classId">班級代碼</label>
          <input type="text" id="classId" placeholder="例如：7A">
        </div>
        <div>
          <label for="className">班級名稱（可選）</label>
          <input type="text" id="className" placeholder="例：七年甲班">
        </div>
        <div>
          <label for="classSize">班級人數</label>
          <input type="number" id="classSize" min="1" max="100" value="30">
        </div>
        <div style="align-self: end;">
          <button id="createClassBtn">建立班級並自動產生密碼</button>
        </div>
      </div>
      <div class="small-note">學生密碼僅儲存在瀏覽器，可隨時匯出 JSON 備份。</div>

      <div class="table-scroll" style="margin-top: 1rem;">
        <table id="studentTable">
          <thead>
            <tr>
              <th>座號</th>
              <th>姓名</th>
              <th>密碼</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="flex-between" style="margin-top: 0.75rem;">
        <div>
          <button class="secondary" id="importBtn">匯入 JSON</button>
          <input type="file" id="importFile" accept="application/json" style="display:none;">
          <button id="exportBtn">匯出 JSON</button>
        </div>
        <div class="small-note">若變更密碼，請重新產生新的回饋連結。</div>
      </div>
    </section>

    <section class="section" id="feedback-section">
      <h2>回饋編輯器</h2>
      <div class="grid-2">
        <div>
          <label for="studentSelect">選擇學生</label>
          <select id="studentSelect"></select>
        </div>
        <div>
          <label for="essayId">作文標題 / 編號</label>
          <input type="text" id="essayId" placeholder="例如：2025-校服議題">
        </div>
      </div>

      <div id="aspectContainer"></div>

      <label for="overallComment" style="margin-top:1rem;">整體總評（可選）</label>
      <textarea id="overallComment" placeholder="給學生的鼓勵或下一步建議"></textarea>

      <div class="flex-between" style="margin-top: 0.75rem;">
        <button id="generateUrlBtn">產生學生專屬連結</button>
        <div id="urlBox" style="flex:1; margin-left:0.75rem; display:none;">
          <label>回饋連結</label>
          <div class="flex-between">
            <input type="text" id="generatedUrl" readonly class="inline-input" style="flex:1;">
            <button id="copyUrlBtn" class="secondary">複製</button>
          </div>
        </div>
      </div>
      <div id="status" class="status" style="display:none;"></div>
    </section>
  </div>

  <script src="rubric.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
